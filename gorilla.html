    <!-- No visible text on this page for the gorilla to align to, but
         site.js still needs the same 1200px-capped content column every
         other page has to measure its horizontal position against —
         zero height, nothing rendered, purely a reference for that. -->
    <div class="inner" aria-hidden="true"></div>

    <!-- .gorilla-reveal-mask/.gorilla-body: an on-load "rises up from the
         bottom, chest-up only" reveal — per an explicit request scoped to
         this page. .gorilla-wrap's own box (size/position) is left exactly
         as every other page computes it, so site.js's positioning and
         nav-clearance math needs no changes; the mask only crops what's
         visually PAINTED inside that same box, and .gorilla-body restores
         the full-height coordinate space inside the (shorter) mask so
         .gorilla-lottie itself is completely unaware anything changed. See
         styles.css for the sizing/animation. -->
    <div class="gorilla-wrap" aria-hidden="true">
      <div class="gorilla-reveal-mask">
        <div class="gorilla-body">
          <div class="gorilla-lottie" role="img" aria-label="A gorilla, sitting quietly. That's the whole page."></div>
        </div>
      </div>
    </div>
