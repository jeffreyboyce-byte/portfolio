<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clyde — Jeffrey Boyce</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Archivo+Narrow:wght@700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --coral:   #d97757;
      --coral10: rgba(217,119,87,0.10);
      --coral25: rgba(217,119,87,0.25);
      --coral55: rgba(217,119,87,0.55);
      --bg:      #1f1f1e;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      overflow: hidden;
      font-family: -apple-system, 'Helvetica Neue', sans-serif;
    }

    #stage {
      position: relative;
      width: 100vw; height: 100vh;
    }

    /* ─────────────────────────────────────────────
       NAME — purely stationary, zero animation
       Container + three child layers
    ───────────────────────────────────────────── */
    #charName {
      position: absolute;
      pointer-events: none;
      user-select: none;
      /* left / top / width / height set by JS */
    }


    /* ─────────────────────────────────────────────
       CHARACTER WRAPPER — the ONLY thing that moves
       Contains body + both disguises.
       Name is NOT inside here.
    ───────────────────────────────────────────── */
    #charWrapper {
      position: absolute;
      transform-origin: center center;
      /* left / top / width / height set by JS */
    }

    /* Sunburst body fills the wrapper */
    #charBody {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      user-select: none;
    }

    /* ─────────────────────────────────────────────
       DISGUISE — two variants that cross-fade on wake/sleep.
       disguiseSleep (45:77): closed-eye curves baked into lenses.
       disguiseAwake (45:60): open empty lenses.
    ───────────────────────────────────────────── */
    #disguiseSleep, #disguiseAwake {
      position: absolute;
      pointer-events: none;
      user-select: none;
      z-index: 1;
      transition: opacity 0.45s ease;
      /* left / top / width / height set by JS */
    }

    /* Sleeping disguise: visible by default, fades out on wake */
    #disguiseSleep { opacity: 1; }
    #stage.waking    #disguiseSleep,
    #stage.awake     #disguiseSleep,
    #stage.listening #disguiseSleep,
    #stage.thinking  #disguiseSleep,
    #stage.speaking  #disguiseSleep { opacity: 0; }

    /* Awake disguise: hidden by default, fades in on wake */
    #disguiseAwake { opacity: 0; }
    #stage.waking    #disguiseAwake,
    #stage.awake     #disguiseAwake,
    #stage.listening #disguiseAwake,
    #stage.thinking  #disguiseAwake,
    #stage.speaking  #disguiseAwake { opacity: 1; }

    /* ─────────────────────────────────────────────
       OPEN EYES — 46×9 strip, shown when awake only
    ───────────────────────────────────────────── */
    #eyesOpen {
      position: absolute;
      pointer-events: none;
      user-select: none;
      z-index: 2;
      opacity: 0;
      transition: opacity 0.45s ease;
      /* left / top / width / height set by JS */
    }
    #stage.waking    #eyesOpen,
    #stage.awake     #eyesOpen,
    #stage.listening #eyesOpen,
    #stage.thinking  #eyesOpen,
    #stage.speaking  #eyesOpen { opacity: 1; }

    /* ─────────────────────────────────────────────
       CHARACTER ANIMATIONS (wrapper only)
    ───────────────────────────────────────────── */

    /* Sleeping — gentle float */
    #stage.sleeping #charWrapper {
      animation: anim-float 4s ease-in-out infinite;
    }
    @keyframes anim-float {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-9px); }
    }

    /* Wake pop */
    #stage.waking #charWrapper {
      animation: anim-wake 0.55s cubic-bezier(0.34,1.45,0.64,1) forwards;
    }
    @keyframes anim-wake {
      0%   { transform: scale(0.92) translateY(8px); }
      100% { transform: scale(1)    translateY(0px); }
    }

    /* Awake idle */
    #stage.awake:not(.listening):not(.thinking):not(.speaking) #charWrapper {
      animation: anim-idle 6s ease-in-out infinite;
    }
    @keyframes anim-idle {
      0%   { transform: translateY(0px)   rotate(0deg)    scale(1.000); }
      20%  { transform: translateY(-7px)  rotate(1.2deg)  scale(1.010); }
      50%  { transform: translateY(-13px) rotate(0deg)    scale(1.015); }
      80%  { transform: translateY(-7px)  rotate(-1.2deg) scale(1.010); }
      100% { transform: translateY(0px)   rotate(0deg)    scale(1.000); }
    }

    /* Listening — alert, perking up */
    #stage.listening #charWrapper {
      animation: anim-listen 1.6s ease-in-out infinite;
    }
    @keyframes anim-listen {
      0%, 100% { transform: translateY(0px)  rotate(0deg)    scale(1.000); }
      40%      { transform: translateY(-8px) rotate(1.0deg)  scale(1.014); }
      70%      { transform: translateY(-5px) rotate(-0.6deg) scale(1.008); }
    }

    /* Thinking — contemplative sway */
    #stage.thinking #charWrapper {
      animation: anim-think 3s ease-in-out infinite;
    }
    @keyframes anim-think {
      0%, 100% { transform: rotate(0deg)    translateY(0px)  scale(1.000); }
      30%      { transform: rotate(2.5deg)  translateY(-5px) scale(1.008); }
      70%      { transform: rotate(-2.0deg) translateY(-7px) scale(1.010); }
    }

    /* Speaking — rhythmic bob */
    #stage.speaking #charWrapper {
      animation: anim-speak 0.42s ease-in-out infinite alternate;
    }
    @keyframes anim-speak {
      0%   { transform: scale(1.000) translateY(0px)  rotate(0deg);   }
      100% { transform: scale(1.016) translateY(-5px) rotate(0.3deg); }
    }

    /* ─────────────────────────────────────────────
       ZZZ  (container positioned by JS)
    ───────────────────────────────────────────── */
    #zzzWrap {
      position: absolute;
      pointer-events: none;
      z-index: 15;
      transition: opacity 0.4s ease;
    }
    #stage.waking    #zzzWrap,
    #stage.awake     #zzzWrap,
    #stage.listening #zzzWrap,
    #stage.thinking  #zzzWrap,
    #stage.speaking  #zzzWrap { opacity: 0; pointer-events: none; }

    .z {
      position: absolute;
      font-family: 'Georgia', serif;
      font-style: italic;
      font-weight: 700;
      color: var(--coral);
      opacity: 0;
      text-shadow: 0 0 14px rgba(217,119,87,0.35);
      animation: zzz-rise 3.6s ease-in-out infinite;
      line-height: 1;
    }
    .z:nth-child(1) { font-size: 14px; left:  0px; top:  24px; animation-delay: 0s;    }
    .z:nth-child(2) { font-size: 20px; left: 16px; top:   6px; animation-delay: 1.2s; }
    .z:nth-child(3) { font-size: 26px; left: 38px; top: -12px; animation-delay: 2.4s; }

    @keyframes zzz-rise {
      0%   { opacity: 0;    transform: translate(0px,   0px)  scale(0.8); }
      18%  { opacity: 0.9;  }
      82%  { opacity: 0.55; }
      100% { opacity: 0;    transform: translate(12px,-46px)  scale(1.1); }
    }

    /* ─────────────────────────────────────────────
       LISTEN RINGS  (container positioned by JS)
    ───────────────────────────────────────────── */
    #listenRings {
      position: absolute;
      pointer-events: none;
      z-index: 3;
    }
    .lring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid var(--coral);
      transform: translate(-50%, -50%) scale(0.85);
      opacity: 0;
    }
    #stage.listening .lring { animation: ring-out 2.2s ease-out infinite; }
    #stage.listening .lring:nth-child(1) { animation-delay: 0s;    }
    #stage.listening .lring:nth-child(2) { animation-delay: 0.6s;  }
    #stage.listening .lring:nth-child(3) { animation-delay: 1.2s;  }

    @keyframes ring-out {
      0%   { opacity: 0.65; transform: translate(-50%,-50%) scale(0.85); }
      100% { opacity: 0;    transform: translate(-50%,-50%) scale(1.40); }
    }

    /* ─────────────────────────────────────────────
       HITBOX  (positioned by JS)
    ───────────────────────────────────────────── */
    #charHitbox {
      position: absolute;
      border-radius: 50%;
      cursor: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEsAAABMCAYAAAAlS0pSAAAGA0lEQVR4AeyajVXsKhRG4VWgFagVqBU4VqAdOFagVqBWoFagVqAdOFagHagVaAe+7NycLEKAQMLMnfUed3nk73CAnQ/CzPUfVf5FEyiwolEpVWAVWAkEElyLsgqsBAIJrkVZBVYCgQTXoqwCK4FAgmtRVoGVQCDBtSjrvw8rYYUZXYuyEmAWWAVWAoEE16KsAiuBQILrVGX9VmMNWeWytJ+Vjj0FFhONoYAfFuOb4hMTM8YneswpsKIHaRxTJ45/yJqwq0uywbq8vFRvb2/q/v4+NHsWH2qXtlg/8VdnZ2fq5uamLRuZ5FhG3042C6yTkxN1dXWl9vb21Hw+V7+/v3VZuf9lm7yEB9Tt7a06Pz9XHx8fUp09zQJrY2OjNzGUBsBeQ7cCcC7reBHr+/u7fgguGMfHx63/9vZ2mzcyjGEUx2WzwLq7u3OOziI9wJg85uxnVj49PdUqlQcCDBvYz8+P2UW9vLx0yrkKWWAxma+vL5KeAYxt0muIrDBVI10ABkQpf35+SrZOZ7NZnVq/oh6O1adTnAxLorEAydsp54ldZ5dZPGbXv7+/21V12YRoKwuHZahrCizNpEwLQbG3jvTjDcYLgcVjnE3SRvr8/EziNPrh79rqy1DXFFi9BVxcXCjfdkR5gLE78QYz6zibTLDX19dmcy+Pf6+yqcitrqmwdDOvNgGKa1vgABj7/HL5EsMEu1gs6J5sHnUlx5EOU2FJnE4KlE6FUbiq7mNGUfm27nl1ZxK/nZ0dySanjvijD/ocsHrqenx8VDYUWSXbxt5mLnXhL2fS1tYWxVHGhXlUR0enHLAI2wPGWeN4qvgqe5v5/HAGLulYm9rfHDcXLDNmm+fA9503bDM5vwDbdlpCJvQwUobLCaunLiZyeHiofHcl2aoCDf9UIz5nmm8rE+/g4IBksuWExWScwPb3951XCrYI59KUJ8+D4AYfisE4TG6q5YbFfJzAOKdCT5+OQwYY+x7HdqYfn0+nxidOyHLB4nVsmnNM2XbOxoFKbvIo1H67sYVRDqB86qJtIHxUcw5YQIoajKf/8PAQ5Ws7AYS619dXtVgsyNZG/ZC61gVWNKh6ZdWv09NT5/lVNbU/wACAucjZbKbkoL6yLrZD6kKVbfA/mVG/cyirMzDbBOtUWgXOL6uqU7yuPg+iQntbCaRUdRGrM8DIQlZYfAPANsN4y2F8L++CZ4Mw54+KKLPIXOoi3lTLBovXN+eHPSG+lwceH3FMaFxYbV8pm9tK1CRtUk5Vl/SfkmaDNfT5ja0n0Pj2FLi+iQOdM4t21GVeF1BdytllKpN4lTmvNlX94E82WOaCQqMCDXUMwRV1EQu4pGL0Jx9SFy8JfBywkl9KxMGywQJCLDAGHjJTXXyLYcYeUhdwUSRjEIc0h2WDxWQAxlYjn8PGqgvl7e7u1lPwwBqlrqywmB33KK21ApqpBtpSjYWiEvqF1BU6/+gbevPSHmtTYXkPS6ChtPl8PngJDU2Wg17ONwEn/pxLvGUZQ+pcqfkWdrXH1k2FxTheYDSiCKCxNSiPMelLLPvAJjYxqddaK63/mKlqFDrwNxiEGLQcsBhEV7+wKnH/cCvXWo9SGco5OjqqP+6wcNcIKNCsB+K8UTUKROlm+5h8LlgyNsAwKfdSFsHCUEKvMVDB5zsW7XNBdXYbdYx3WH0BabeNKeeGJXMAGCblTsprfXNzU/ES6DSseWFZsGTZAMOk3EnZGrramkAzz5iOU0QhVaVVSO+cqjbvz7JhycDByQGN7aL1uCsH200GalLGC1njlpasChazksmT95oJjrMtpDjuV1rr+o/YvAEzNqwSlkw7ChrOnG0ozgbGQa+1VjsT/qea+Kn2N2DJHAUaqdQ5U4DRIJByvd2ImWJ/E5Y5T4CJmfVtXmutIiAFY7T       z-index: 20;
    }
    #stage.sleeping #charHitbox:hover { filter: brightness(1.08); }

    /* ─────────────────────────────────────────────
       VOICE UI  (JS-positioned between name and hint)
    ───────────────────────────────────────────── */
    #voiceUI {
      position: absolute;
      left: 0; right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      z-index: 30;
      transform-origin: top center;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.45s ease 0.15s, transform 0.45s ease 0.15s;
      pointer-events: none;
    }
    #stage.awake     #voiceUI,
    #stage.listening #voiceUI,
    #stage.thinking  #voiceUI,
    #stage.speaking  #voiceUI {
      opacity: 1;
      transform: translateY(0);
      pointer-events: all;
    }

    #thinkDots { display: flex; gap: 5px; opacity: 0; transition: opacity 0.25s; }
    #stage.thinking #thinkDots { opacity: 1; }
    .tdot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--coral);
      animation: tdot 1s ease-in-out infinite;
    }
    .tdot:nth-child(2) { animation-delay: 0.2s; }
    .tdot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes tdot {
      0%,80%,100% { transform: scale(0.7); opacity: 0.4; }
      40%          { transform: scale(1.2); opacity: 1;   }
    }

    #waveform { display: flex; align-items: center; gap: 4px; height: 60px; }
    .wbar {
      width: 4px; height: 5px; background: var(--coral); border-radius: 3px;
      transform-origin: center;
    }
    #stage.speech-active .wbar,
    #stage.speaking      .wbar { animation: wbar var(--spd) ease-in-out infinite alternate; }

    @keyframes wbar {
      0%   { height: 5px;         opacity: 0.5; }
      60%  { height: calc(var(--h) * 0.7); opacity: 0.9; }
      100% { height: var(--h);    opacity: 1;   }
    }

    /* Each bar: --h = peak height, --spd = speed, animation-delay for stagger */
    .wbar:nth-child(1)  { --h: min(18px, 4vw); --spd: 0.54s; animation-delay: -0.12s; }
    .wbar:nth-child(2)  { --h: min(42px, 9vw); --spd: 0.41s; animation-delay: -0.33s; }
    .wbar:nth-child(3)  { --h: min(30px, 6.5vw); --spd: 0.68s; animation-delay: -0.07s; }
    .wbar:nth-child(4)  { --h: min(54px, 11vw); --spd: 0.38s; animation-delay: -0.51s; }
    .wbar:nth-child(5)  { --h: min(36px, 8vw);  --spd: 0.58s; animation-delay: -0.22s; }
    .wbar:nth-child(6)  { --h: min(60px, 12vw); --spd: 0.34s; animation-delay: -0.44s; }
    .wbar:nth-child(7)  { --h: min(32px, 7vw);  --spd: 0.62s; animation-delay: -0.16s; }
    .wbar:nth-child(8)  { --h: min(50px, 10vw); --spd: 0.43s; animation-delay: -0.38s; }
    .wbar:nth-child(9)  { --h: min(24px, 5vw);  --spd: 0.71s; animation-delay: -0.09s; }
    .wbar:nth-child(10) { --h: min(44px, 9.5vw); --spd: 0.37s; animation-delay: -0.27s; }
    .wbar:nth-child(11) { --h: min(14px, 3vw);  --spd: 0.56s; animation-delay: -0.18s; }


    /* ── Bottom hints (static, centred, positioned by JS) ───────── */
    #sleepHint, #awakeHint {
      position: absolute;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.30);
      font-family: 'Archivo Narrow', sans-serif;
      font-weight: 700;
      font-size: 16px; letter-spacing: 0.20em; text-transform: uppercase;
      pointer-events: none;
      z-index: 25;
      opacity: 0;
      transition: opacity 0.45s ease;
      white-space: nowrap;
    }
    #stage.sleeping  #sleepHint { opacity: 1; }
    #stage.awake     #awakeHint,
    #stage.listening #awakeHint,
    #stage.thinking  #awakeHint,
    #stage.speaking  #awakeHint { opacity: 1; }

    /* ── Cursor-following tooltip ────────────────────────────────── */
    #cursorTip {
      position: fixed;
      background: #1F1F1E;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.12);
      font-family: 'Fredoka One', cursive;
      font-size: 15px;
      letter-spacing: 0.02em;
      padding: 7px 18px;
      border-radius: 50px;
      pointer-events: none;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.14s ease, transform 0.14s ease;
      z-index: 1000;
      white-space: nowrap;
      box-shadow: 0 4px 14px rgba(0,0,0,0.30), 0 0 0 2px rgba(255,255,255,0.25);
    }
    #cursorTip.visible {
      opacity: 1;
      transform: translateY(0px);
    }

    /* Browser warning */
    #browserWarn {
      display: none; position: fixed;
      bottom: 16px; left: 50%; transform: translateX(-50%);
      background: rgba(217,119,87,0.12);
      border: 1px solid var(--coral25); border-radius: 10px;
      color: rgba(255,255,255,0.6); font-size: 12px;
      padding: 9px 18px; white-space: nowrap; z-index: 100;
    }
  </style>
</head>
<body>
<div id="stage" class="sleeping">

  <!-- Name: stationary, NEVER animates. Single vectorized Figma asset (45:65). -->
  <img id="charName"
       src="https://www.figma.com/api/mcp/asset/4206be20-d169-498e-aeab-7123d014af98"
       alt="Clyde" draggable="false" />

  <!-- Character wrapper: the ONLY animated element -->
  <div id="charWrapper">
    <!-- 45:72 Sunburst body — fills wrapper -->
    <img id="charBody"
         src="https://www.figma.com/api/mcp/asset/a75789b4-af59-49bc-8fee-699f0132090d"
         alt="" draggable="false" />
    <!-- 45:77 Sleeping disguise — closed-eye curves baked into lenses -->
    <img id="disguiseSleep"
         src="https://www.figma.com/api/mcp/asset/fc2da154-e3a1-4aa0-9a7b-2984905d3fe9"
         alt="" draggable="false" />
    <!-- 45:60 Awake disguise — open empty lenses (eyes are a separate layer) -->
    <img id="disguiseAwake"
         src="https://www.figma.com/api/mcp/asset/828e96f6-a18e-484e-b7c0-e892c3eee2ac"
         alt="" draggable="false" />
    <!-- 49:99 Open eyes — 46×9 strip, shown when awake -->
    <img id="eyesOpen"
         src="https://www.figma.com/api/mcp/asset/d8fdd08f-b817-4b28-934a-5509c28bb87e"
         alt="" draggable="false" />
  </div>

  <!-- Rings, ZZZ, hitbox -->
  <div id="listenRings">
    <div class="lring"></div>
    <div class="lring"></div>
    <div class="lring"></div>
  </div>

  <div id="zzzWrap">
    <span class="z">z</span>
    <span class="z">z</span>
    <span class="z">Z</span>
  </div>

  <div id="charHitbox" role="button" tabindex="0" aria-label="Wake up Clyde"></div>

  <!-- Static bottom hints -->
  <div id="sleepHint">tap clyde to wake</div>
  <div id="awakeHint">tap clyde to sleep</div>

  <!-- Cursor-following tooltip -->
  <div id="cursorTip"></div>

  <!-- Voice UI -->
  <div id="voiceUI">
    <div id="thinkDots">
      <div class="tdot"></div><div class="tdot"></div><div class="tdot"></div>
    </div>
    <div id="waveform"></div>
  </div>

</div>
<div id="browserWarn">Voice recognition needs Chrome or Edge.</div>

<script>
/* ══════════════════════════════════════════
   FIGMA LAYOUT CONSTANTS
   Frame: 1200 × 800  (node 49:97)
   All positions are in Figma canvas units.
══════════════════════════════════════════ */
const IMG_W = 1200, IMG_H = 800;

// Sunburst body (44:24)
const CHAR_X = 515, CHAR_Y = 319, CHAR_W = 161, CHAR_H = 161;

// Disguise frame (45:60) — glasses, nose, mustache
const DISG_X = 551, DISG_Y = 368, DISG_W = 90,   DISG_H = 77.7;

// Eyes Open (49:99) — relative offset from charWrapper origin
const EYES_DX = 57, EYES_DY = 67, EYES_W = 46, EYES_H = 9;


// Name group (45:65) — single vectorized image
const NAME_X = 491.31, NAME_Y = 498, NAME_W = 210.25, NAME_H = 81.37;

/* ══════════════════════════════════════════
   DOM REFS
══════════════════════════════════════════ */
const stage         = document.getElementById('stage');
const charWrapper   = document.getElementById('charWrapper');
const charBody      = document.getElementById('charBody');
const disguiseSleep = document.getElementById('disguiseSleep');
const disguiseAwake = document.getElementById('disguiseAwake');
const eyesOpen      = document.getElementById('eyesOpen');
const charNameEl    = document.getElementById('charName');
const zzzWrap       = document.getElementById('zzzWrap');
const listenRings   = document.getElementById('listenRings');
const charHitbox    = document.getElementById('charHitbox');
const voiceUI       = document.getElementById('voiceUI');

/* ══════════════════════════════════════════
   LAYOUT  —  Figma coords → viewport px
   Portrait phones: scale to width so the
   character fills the screen nicely instead
   of being miniaturised by the 1200px frame.
══════════════════════════════════════════ */
function layoutOverlays() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const isPortrait = vh > vw;
  // 650 = the character-centric portion of the 1200px frame
  const scale = isPortrait
    ? vw / 650
    : Math.min(vw / IMG_W, vh / IMG_H);
  const rendW = IMG_W * scale, rendH = IMG_H * scale;
  const offX  = (vw - rendW) / 2;
  const offY  = (vh - rendH) / 2;

  // ── Character wrapper = sunburst bounding box ─────────────────
  const wL = offX + CHAR_X * scale;
  const wT = offY + CHAR_Y * scale;
  const wW = CHAR_W * scale;
  const wH = CHAR_H * scale;
  Object.assign(charWrapper.style, {
    left: wL + 'px', top: wT + 'px',
    width: wW + 'px', height: wH + 'px',
  });

  // ── Disguise variants — same position, different images ───────
  const dL = (DISG_X - CHAR_X) * scale;
  const dT = (DISG_Y - CHAR_Y) * scale;
  const dStyles = { left: dL + 'px', top: dT + 'px', width: DISG_W * scale + 'px', height: DISG_H * scale + 'px' };
  Object.assign(disguiseSleep.style, dStyles);
  Object.assign(disguiseAwake.style, dStyles);

  // ── Eyes Open (49:99) — relative to wrapper top-left ──────────
  Object.assign(eyesOpen.style, {
    left:   EYES_DX * scale + 'px',
    top:    EYES_DY * scale + 'px',
    width:  EYES_W  * scale + 'px',
    height: EYES_H  * scale + 'px',
  });

  // ── Name (45:65) — single vectorized image, stationary ────────
  Object.assign(charNameEl.style, {
    left:   (offX + NAME_X * scale) + 'px',
    top:    (offY + NAME_Y * scale) + 'px',
    width:  NAME_W * scale + 'px',
    height: NAME_H * scale + 'px',
  });

  // ── Voice UI — centred in gap between name bottom and hint text ─
  // Figma: name bottom ≈ y=579, hint text ≈ y=686 → midpoint ≈ 632
  const vuY = offY + 632 * scale;
  voiceUI.style.top = vuY + 'px';

  // ── Character centre (for hitbox / rings / ZZZ) ───────────────
  const cx = wL + wW / 2;
  const cy = wT + wH / 2;

  // ZZZ: upper-right of character
  zzzWrap.style.left = (cx + wW * 0.28) + 'px';
  zzzWrap.style.top  = (cy - wH * 0.55) + 'px';

  // Listen rings
  listenRings.style.left = cx + 'px';
  listenRings.style.top  = cy + 'px';
  const rb   = wW * 1.15;
  const rEls = listenRings.querySelectorAll('.lring');
  rEls[0].style.width = rEls[0].style.height = (rb * 1.00) + 'px';
  rEls[1].style.width = rEls[1].style.height = (rb * 1.35) + 'px';
  rEls[2].style.width = rEls[2].style.height = (rb * 1.70) + 'px';

  // Hitbox
  const hs = wW * 1.2;
  Object.assign(charHitbox.style, {
    left: (cx - hs / 2) + 'px', top: (cy - hs / 2) + 'px',
    width: hs + 'px', height: hs + 'px',
  });

  // Bottom hints — centred horizontally at Figma y ≈ 752
  const hintY = (offY + 752 * scale) + 'px';
  const hintX = (vw / 2) + 'px';
  [document.getElementById('sleepHint'), document.getElementById('awakeHint')].forEach(el => {
    el.style.left = hintX;
    el.style.top  = hintY;
  });
}

layoutOverlays();
window.addEventListener('resize', layoutOverlays);

// On mobile, update the awake hint to reflect tap-to-speak model
if (('ontouchstart' in window) || (navigator.maxTouchPoints > 0)) {
  const awakeHintEl = document.getElementById('awakeHint');
  if (awakeHintEl) awakeHintEl.textContent = 'tap clyde to speak';

/* ══════════════════════════════════════════
   STATE MACHINE
══════════════════════════════════════════ */
const S = {
  SLEEPING: 'sleeping', WAKING: 'waking', AWAKE: 'awake',
  LISTENING: 'listening', THINKING: 'thinking', SPEAKING: 'speaking',
};
let state = S.SLEEPING;

function setState(s) {
  state = s;
  // Always include the state name; add 'awake' superclass for all post-sleep states
  const cls = ['stage', s];
  if (s !== S.SLEEPING && s !== S.WAKING) cls.push('awake');
  stage.className = cls.join(' ');

}

/* ══════════════════════════════════════════
   BLINK  —  fully decoupled from wrapper animation
   Manipulates disguiseClosed opacity directly,
   bypassing CSS transitions for the close stroke
   so the open/close feels like a real blink.
══════════════════════════════════════════ */
let blinkTimer = null;

function doBlink() {
  if (state === S.SLEEPING || state === S.WAKING) { scheduleBlink(); return; }

  // Instant close — hide eyes immediately (bypass CSS transition)
  eyesOpen.style.transition = 'none';
  eyesOpen.style.opacity    = '0';

  setTimeout(() => {
    // Smooth open — restore transition, CSS cascade drives back to 1
    eyesOpen.style.transition = 'opacity 0.09s ease';
    eyesOpen.style.opacity    = ''; // → CSS cascade → 1
    scheduleBlink();
  }, 130);
}

function scheduleBlink() {
  clearTimeout(blinkTimer);
  // Occasional double-blink (15 % chance) makes it feel alive
  const delay = Math.random() < 0.15 ? 400 : 3000 + Math.random() * 5000;
  blinkTimer = setTimeout(doBlink, delay);
}

/* ══════════════════════════════════════════
   WAKE UP / GO TO SLEEP
══════════════════════════════════════════ */
/* ══════════════════════════════════════════
   iOS AUDIO UNLOCK
   iOS blocks audio.play() unless it occurs
   inside a user-gesture call stack. Calling
   AudioContext.resume() here, from the tap
   handler, unlocks all subsequent playback.
══════════════════════════════════════════ */
let _audioCtx = null;
function unlockAudio() {
  if (_audioCtx) return;
  try {
    _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    _audioCtx.resume();
    // Play a zero-length silent buffer to fully unlock HTML5 audio on iOS
    const buf = _audioCtx.createBuffer(1, 1, 22050);
    const src = _audioCtx.createBufferSource();
    src.buffer = buf;
    src.connect(_audioCtx.destination);
    src.start(0);
  } catch (_) {}
}

let micStream = null;

async function ensureMicPermission() {
  if (micStream) return; // already granted
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    // Keep the stream alive — this holds the permission for the session
    // SpeechRecognition uses its own internal stream; this just primes the grant
  } catch (err) {
    console.warn('Mic permission denied:', err);
  }
}

function wakeUp() {
  if (state !== S.SLEEPING) return;
  setState(S.WAKING);
  unlockAudio();          // unlock iOS audio from this tap gesture
  ensureMicPermission(); // request mic once, non-blocking
  setTimeout(() => {
    setState(S.AWAKE);
    scheduleBlink();
    scheduleRestart(); // auto-start listening
    launchVoiceflow(); // init Voiceflow session
  }, 580);
}

function goToSleep() {
  if (state === S.SLEEPING || state === S.WAKING) return;
  stopListening();
  stopAudio();
  clearTimeout(blinkTimer);
  setState(S.SLEEPING);
}

charHitbox.addEventListener('click', () => {
  if (state === S.SLEEPING) {
    wakeUp();
    // Start recognition immediately inside this gesture event (critical for Android Chrome).
    // On mobile this is the ONLY reliable way to call recognition.start().
    if (recognition && !isListening) {
      try { recognition.start(); isListening = true; } catch (_) {}
    }
  } else if (state === S.AWAKE && isMobile) {
    // Mobile tap-to-speak: start listening directly from this gesture
    if (recognition && !isListening) {
      try { recognition.start(); isListening = true; setState(S.LISTENING); } catch (_) {}
    }
  } else if (state !== S.WAKING) {
    goToSleep();
  }
});
charHitbox.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') {
    if (state === S.SLEEPING) wakeUp();
    else if (state !== S.WAKING) goToSleep();
  }
});

/* ══════════════════════════════════════════
   VOICEFLOW v4 API INTEGRATION
══════════════════════════════════════════ */
const EL_API_KEY    = 'sk_5010a2b984ce6733cff1661dbe676d247d6e2d4c622f9f5c';
const VF_API_KEY    = 'VF.DM.6a090e73188c5c9883901c8c.e4ZTTOr1qFjgDCUS';
const VF_PROJECT    = '6a090b66a62d285256e04fad';
const VF_ENV        = 'main';
const VF_USER_ID    = 'clyde_' + Date.now();
const VF_SESSION_URL = `https://general-runtime.voiceflow.com/v4/project/${VF_PROJECT}/environment/${VF_ENV}/session`;
const VF_INTERACT_URL = 'https://general-runtime.voiceflow.com/v4/interact';

let vfSessionKey = null;

async function startVoiceflowSession() {
  const res = await fetch(VF_SESSION_URL, {
    method:  'POST',
    headers: { 'Authorization': VF_API_KEY, 'Content-Type': 'application/json' },
    body:    JSON.stringify({ userID: VF_USER_ID }),
  });
  if (!res.ok) {
    const body = await res.text().catch(() => '');
    throw new Error(`Session ${res.status}: ${body.slice(0, 200)}`);
  }
  const data = await res.json();
  vfSessionKey = data.sessionKey;
  console.log('[VF session started]', vfSessionKey);
}

async function vfInteract(action) {
  if (!vfSessionKey) await startVoiceflowSession();
  const res = await fetch(VF_INTERACT_URL, {
    method:  'POST',
    headers: { 'Authorization': vfSessionKey, 'Content-Type': 'application/json' },
    body:    JSON.stringify({ action, config: { tts: true, stripSSML: true } }),
  });
  if (!res.ok) {
    const body = await res.text().catch(() => '');
    throw new Error(`HTTP ${res.status}: ${body.slice(0, 200)}`);
  }
  const data = await res.json();
  const traces = data.traces || data;
  console.log('[VF traces]', JSON.stringify(traces));

  // Collect text + voice reference (format: "elevenlabs:model_id:voice_id")
  let voiceRef = null;
  const text = traces
    .filter(t => t.type === 'text' || t.type === 'speak')
    .map(t => {
      if (t.payload?.voice && !voiceRef) voiceRef = t.payload.voice;
      const msg = t.payload?.message;
      if (msg) return msg;
      const content = t.payload?.slate?.content;
      if (content) return content.flatMap(b => b.children?.map(c => c.text) || []).join(' ');
      return '';
    })
    .filter(Boolean)
    .join(' ');

  // Pre-rendered audio URLs (legacy speak traces)
  const audioSrcs = traces
    .filter(t => t.type === 'speak' && t.payload?.src)
    .map(t => t.payload.src);

  return { text, audioSrcs, voiceRef };
}

async function launchVoiceflow() {
  try {
    await startVoiceflowSession();
    await vfInteract({ type: 'launch' });
  } catch (e) { console.warn('[VF launch]', e.message); }
}

async function queryVoiceflow(text) {
  const result = await vfInteract({ type: 'text', payload: text });
  if (!result.text && !result.audioSrcs.length) {
    return { text: "I didn't catch that — could you try again?", audioSrcs: [], voiceRef: null };
  }
  return result;
}

/* ══════════════════════════════════════════
   ELEVEN LABS SYNTHESIS
   voiceRef format: "elevenlabs:model_id:voice_id"
══════════════════════════════════════════ */
async function synthesizeElevenLabs(text, voiceRef) {
  const parts   = (voiceRef || '').split(':');
  const voiceId = parts[2] || 'N2lVS1w4EtoT3dr4eOWO'; // Callum
  const modelId = parts[1] || 'eleven_turbo_v2_5';
  const res = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}`, {
    method:  'POST',
    headers: { 'xi-api-key': EL_API_KEY, 'Content-Type': 'application/json' },
    body:    JSON.stringify({
      text,
      model_id: modelId,
      voice_settings: { stability: 0.5, similarity_boost: 0.75, style: 0.3, use_speaker_boost: true }
    }),
  });
  if (!res.ok) throw new Error(`ElevenLabs ${res.status}`);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}

/* ══════════════════════════════════════════
   SPEECH RECOGNITION  —  always-on when awake
══════════════════════════════════════════ */
// On mobile, Android Chrome blocks recognition.start() from setTimeout chains.
// We use explicit tap-to-speak instead of the auto-restart loop.
const isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null, isListening = false;

if (!SR) {
  const warn = document.getElementById('browserWarn');
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  warn.textContent = isIOS
    ? 'Voice input isn\'t supported on iOS Safari. Try Chrome on Android or a desktop browser.'
    : 'Voice recognition needs Chrome or Edge.';
  warn.style.display = 'block';
} else {
  recognition = new SR();
  recognition.continuous     = false;
  recognition.interimResults = false;
  recognition.lang           = 'en-US';

  recognition.onspeechstart = () => stage.classList.add('speech-active');
  recognition.onspeechend   = () => stage.classList.remove('speech-active');

  recognition.onresult = (e) => {
    const transcript = e.results[e.results.length - 1][0].transcript;
    stopListening();
    processQuery(transcript);
  };
  recognition.onerror = (e) => {
    console.warn('[SR error]', e.error);
    isListening = false;
    stage.classList.remove('speech-active');
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      const warn = document.getElementById('browserWarn');
      warn.textContent = 'Microphone access denied — tap the lock icon in the address bar and allow the microphone, then refresh.';
      warn.style.display = 'block';
      return;
    }
    if (state === S.LISTENING || state === S.WAKING) setState(S.AWAKE);
    if (state === S.AWAKE) scheduleRestart();
  };
  recognition.onend = () => {
    isListening = false;
    stage.classList.remove('speech-active');
    if (isMobile) {
      // Mobile: return to AWAKE (waiting for next tap) instead of looping
      if (state === S.LISTENING) setState(S.AWAKE);
      return;
    }
    // Desktop: keep the mic loop alive while awake
    if (state === S.AWAKE || state === S.LISTENING) scheduleRestart();
  };
}

let restartTimer = null;
function scheduleRestart() {
  clearTimeout(restartTimer);
  restartTimer = setTimeout(startListening, 300);
}

function startListening() {
  if (!recognition || isListening) return;
  if (state !== S.AWAKE && state !== S.WAKING) return;
  isListening = true;
  try {
    recognition.start();
    setState(S.LISTENING);
  } catch (e) {
    // Recognizer still cleaning up — retry shortly
    isListening = false;
    scheduleRestart();
  }
}

function stopListening() {
  isListening = false;
  clearTimeout(restartTimer);
  stage.classList.remove('speech-active');
  try { recognition && recognition.stop(); } catch (_) {}
}

/* ══════════════════════════════════════════
   ELEVEN LABS AUDIO PLAYBACK
══════════════════════════════════════════ */
let currentAudio = null;

function stopAudio() {
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.src = '';
    currentAudio = null;
  }
  synth && synth.cancel();
}

async function playAudioSrcs(srcs, sleepAfter) {
  setState(S.SPEAKING);
  try {
    for (const src of srcs) {
      await new Promise((resolve, reject) => {
        const audio = new Audio(src);
        currentAudio = audio;
        audio.onended  = resolve;
        audio.onerror  = reject;
        audio.play().catch(reject);
      });
    }
  } finally {
    currentAudio = null;
  }
  if (sleepAfter) { goToSleep(); return; }
  if (state === S.SLEEPING) return; // interrupted mid-playback
  setState(S.AWAKE);
  setTimeout(scheduleRestart, 400); // extra gap so mic is clear after audio
}

async function processQuery(text) {
  setState(S.THINKING);
  try {
    const { text: reply, audioSrcs, voiceRef } = await queryVoiceflow(text);
    // If Clyde was put to sleep while the API call was in flight, bail out silently
    if (state === S.SLEEPING) return;
    const sleep = ['bye','goodbye','sleep','go back to sleep','later']
                    .some(w => text.toLowerCase().includes(w));
    if (audioSrcs.length > 0) {
      // Pre-rendered audio from Voiceflow
      await playAudioSrcs(audioSrcs, sleep);
    } else if (reply && voiceRef) {
      // Synthesize via Eleven Labs with the voice Voiceflow specified
      const src = await synthesizeElevenLabs(reply, voiceRef);
      await playAudioSrcs([src], sleep);
    } else {
      speak(reply, sleep); // fallback to browser TTS
    }
  } catch (err) {
    console.error('Voiceflow/ElevenLabs error:', err);
    // Only surface the error if Clyde wasn't deliberately put to sleep
    if (state !== S.SLEEPING) {
      speak("Something went wrong — try again in a moment.");
    }
  }
}

/* ══════════════════════════════════════════
   SPEECH SYNTHESIS
══════════════════════════════════════════ */
const synth = window.speechSynthesis;

function speak(text, sleepAfter = false) {
  if (!synth) { setState(S.AWAKE); return; }
  synth.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.rate = 0.94; utt.pitch = 1; utt.volume = 1;
  const voices = synth.getVoices();
  const pick = voices.find(v =>
    v.name === 'Daniel' ||
    v.name.includes('Google US English') ||
    v.name.includes('Alex') ||
    (v.lang === 'en-US' && !v.name.includes('Google'))
  );
  if (pick) utt.voice = pick;
  utt.onstart = () => setState(S.SPEAKING);
  utt.onend   = () => {
    if (sleepAfter) { goToSleep(); return; }
    setState(S.AWAKE);
    scheduleRestart(); // immediately listen again
  };
  utt.onerror = () => { setState(S.AWAKE); scheduleRestart(); };
  synth.speak(utt);
}
if (synth) synth.onvoiceschanged = () => {};

/* ══════════════════════════════════════════
   CURSOR-FOLLOWING TOOLTIP
══════════════════════════════════════════ */
const cursorTip = document.getElementById('cursorTip');

function updateCursorTipText() {
  cursorTip.textContent = (state === S.SLEEPING) ? 'Tap to Wake!' : 'Tap to Sleep!';
}

charHitbox.addEventListener('mouseenter', (e) => {
  updateCursorTipText();
  cursorTip.style.left = (e.clientX + 20) + 'px';
  cursorTip.style.top  = (e.clientY - 44) + 'px';
  cursorTip.classList.add('visible');
});

charHitbox.addEventListener('mousemove', (e) => {
  updateCursorTipText();
  cursorTip.style.left = (e.clientX + 20) + 'px';
  cursorTip.style.top  = (e.clientY - 44) + 'px';
});

charHitbox.addEventListener('mouseleave', () => {
  cursorTip.classList.remove('visible');
});
